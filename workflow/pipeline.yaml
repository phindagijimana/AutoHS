# AutoHS runnable workflow — two steps

name: autohs
version: "2.0.0"
description: >
  Runnable two-step hippocampal asymmetry workflow.
  Step 1: FreeSurfer processing (container).
  Step 2: AI-compute post-processing + reporting (container).

constraints:
  max_running_jobs: 1
  max_pending_jobs: 5
  supported_formats: [".nii", ".nii.gz"]
  freesurfer_image: freesurfer/freesurfer:7.4.1
  ai_compute_image: autohs/ai-compute:latest
  freesurfer_timeout_minutes: 420

job_states:
  - id: pending
  - id: running
  - id: completed
  - id: failed

phases:
  - id: processing
    name: Processing
    steps:
      - freesurfer-processing
      - ai-compute

execution_order:
  - step: freesurfer-processing
    phase: processing
    actor: runner
    container: freesurfer/freesurfer:7.4.1
    progress: [5, 55]
    description: recon-all segmentation + mri_segstats

  - step: ai-compute
    phase: processing
    actor: runner
    container: autohs/ai-compute:latest
    depends_on: [freesurfer-processing]
    progress: [60, 100]
    description: extract volumes, asymmetry index, overlays, PDF report
