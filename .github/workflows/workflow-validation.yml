name: Workflow Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - run: pip install -r workflow/requirements.txt
      - run: python -m workflow.validate
      - run: python -m unittest workflow.tests.test_workflow -v
